{% extends "base.html" %}

{% block content %}
<section class="error-page">
  <div class="container">
    <div class="row">
      <div class="col-xl-12">
        <div class="error-page__inner">
          <div class="error-page__title-box"><h2 class="error-page__title">404</h2></div>
          <h3 class="error-page__tagline">Sorry, we can't find that page!</h3>
          <p class="error-page__text">The page you are looking for does not exist, or the finding was never recorded.</p>
          <a href="/" class="thm-btn error-page__btn">Back to overview</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
